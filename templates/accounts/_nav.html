{% load i18n nexo %}
<nav class="mb-8 flex w-fit max-w-full gap-1 overflow-x-auto rounded-full bg-white/[.05] p-1 ring-1 ring-inset ring-white/[.08]" aria-label="{% translate 'Account' %}">
  {% url 'accounts:tickets' as u1 %}{% url 'accounts:orders' as u2 %}{% url 'accounts:profile' as u3 %}
  {% with on="bg-text text-ink" off="text-muted hover:text-text" %}
  <a href="{{ u1 }}" class="shrink-0 rounded-full px-4 py-2 text-sm font-semibold transition-colors {% if request.path == u1 %}{{ on }}{% else %}{{ off }}{% endif %}" {% if request.path == u1 %}aria-current="page"{% endif %}>{% translate "My tickets" %}</a>
  <a href="{{ u2 }}" class="shrink-0 rounded-full px-4 py-2 text-sm font-semibold transition-colors {% if request.path == u2 %}{{ on }}{% else %}{{ off }}{% endif %}" {% if request.path == u2 %}aria-current="page"{% endif %}>{% translate "Orders" %}</a>
  <a href="{{ u3 }}" class="shrink-0 rounded-full px-4 py-2 text-sm font-semibold transition-colors {% if request.path == u3 %}{{ on }}{% else %}{{ off }}{% endif %}" {% if request.path == u3 %}aria-current="page"{% endif %}>{% translate "Profile" %}</a>
  {% endwith %}
</nav>
