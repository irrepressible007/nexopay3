{% load i18n nexo %}
<section class="container-x mt-16 sm:mt-24">
  <div class="grid gap-8 lg:grid-cols-[.8fr_1.2fr] lg:gap-10">
    <div class="reveal">
      <h2 class="font-display text-3xl font-bold sm:text-4xl">{{ section.title|default:_("Questions, answered") }}</h2>
      <p class="mt-3 text-muted">{% translate "Can't find what you need?" %} <a href="{% url 'support:contact' %}" class="text-accent hover:underline">{% translate "Talk to us" %}</a>.</p>
    </div>
    <div class="reveal divide-y divide-line rounded-2xl bg-surface ring-1 ring-line" style="--i: 2" x-data="{ open: 0 }">
      {% for f in block.faqs %}
      <div>
        <button type="button" class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left font-semibold transition-colors hover:text-white" @click="open = open === {{ forloop.counter }} ? 0 : {{ forloop.counter }}" :aria-expanded="open === {{ forloop.counter }}">
          {{ f.question }}
          <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full text-muted ring-1 ring-line transition duration-300" :class="open === {{ forloop.counter }} && 'rotate-180 bg-gradient-brand text-on-brand ring-transparent'">{% icon "chevron-down" "w-5 h-5" %}</span>
        </button>
        <div x-show="open === {{ forloop.counter }}" x-cloak x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="opacity-0 -translate-y-1" class="prose-nx px-5 pb-5 text-sm">{{ f.answer|safe }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
