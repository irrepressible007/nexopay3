{% load i18n nexo %}
<section class="container-x mt-20 sm:mt-28">
  <div class="grid gap-10 lg:grid-cols-[.8fr_1.2fr]">
    <div>
      <h2 class="font-display text-3xl font-bold sm:text-4xl">{{ section.title|default:_("Questions, answered") }}</h2>
      <p class="mt-3 text-muted">{% translate "Can't find what you need?" %} <a href="{% url 'support:contact' %}" class="text-accent hover:underline">{% translate "Talk to us" %}</a>.</p>
    </div>
    <div class="divide-y divide-line rounded-2xl bg-surface ring-1 ring-line" x-data="{ open: 0 }">
      {% for f in block.faqs %}
      <div>
        <button type="button" class="flex w-full items-center justify-between gap-4 px-5 py-4 text-left font-semibold" @click="open = open === {{ forloop.counter }} ? 0 : {{ forloop.counter }}" :aria-expanded="open === {{ forloop.counter }}">
          {{ f.question }}
          <span class="shrink-0 text-muted transition" :class="open === {{ forloop.counter }} && 'rotate-180'">{% icon "chevron-down" "w-5 h-5" %}</span>
        </button>
        <div x-show="open === {{ forloop.counter }}" x-transition.opacity x-cloak class="prose-nx px-5 pb-5 text-sm">{{ f.answer|safe }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
