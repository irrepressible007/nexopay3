{% load i18n nexo %}
<div class="reveal mb-6 flex items-end justify-between gap-4 sm:mb-7">
  <div class="min-w-0">
    <h2 class="font-display text-2xl font-bold sm:text-3xl">{{ section.title|default:section.get_kind_display }}</h2>
    {% if section.subtitle %}<p class="mt-1.5 text-muted">{{ section.subtitle }}</p>{% endif %}
  </div>
  {% if see_all %}
  <a href="{{ see_all }}" class="group inline-flex shrink-0 items-center gap-1 rounded-full px-3 py-1.5 text-sm font-semibold text-muted transition hover:bg-white/5 hover:text-text">
    {% translate "See all" %}<span class="transition-transform duration-300 group-hover:translate-x-1">{% icon "arrow-right" "w-4 h-4" %}</span>
  </a>
  {% endif %}
</div>
