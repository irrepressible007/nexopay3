{% load i18n nexo %}
<div class="reveal mb-6 flex items-end justify-between gap-4 sm:mb-7">
  <div>
    <h2 class="flex items-center gap-3 font-display text-2xl font-bold sm:text-3xl"><span class="h-6 w-1.5 shrink-0 rounded-full bg-gradient-to-b from-brand to-brand-2 sm:h-7" aria-hidden="true"></span>{{ section.title|default:section.get_kind_display }}</h2>
    {% if section.subtitle %}<p class="mt-1.5 pl-[1.125rem] text-muted">{{ section.subtitle }}</p>{% endif %}
  </div>
  {% if see_all %}
  <a href="{{ see_all }}" class="group hidden shrink-0 items-center gap-1.5 text-sm font-semibold text-muted hover:text-text sm:inline-flex">
    {% translate "See all" %}<span class="transition group-hover:translate-x-0.5">{% icon "arrow-right" "w-4 h-4" %}</span>
  </a>
  {% endif %}
</div>
