{% load i18n nexo %}
<div class="mb-6 flex items-end justify-between gap-4 sm:mb-8">
  <div class="min-w-0">
    <h2 class="words-scroll text-2xl font-bold tracking-tight sm:text-[1.875rem]">{{ section.title|default:section.get_kind_display|split_words }}</h2>
    {% if section.subtitle %}<p class="reveal mt-1.5 max-w-2xl text-muted" style="--i: 1">{{ section.subtitle }}</p>{% endif %}
  </div>
  {% if see_all %}
  <a href="{{ see_all }}" class="reveal group inline-flex shrink-0 items-center gap-1 rounded-full py-1.5 pl-3 pr-2 text-sm font-semibold text-muted transition-colors hover:text-text">
    {% translate "See all" %}<span class="transition-transform duration-300 group-hover:translate-x-1">{% icon "arrow-right" "w-4 h-4" %}</span>
  </a>
  {% endif %}
</div>
