{% load i18n nexo %}
<section class="container-x section-gap">
  <a href="{{ section.link_url|default:'#' }}" class="group relative block overflow-hidden rounded-2xl ring-1 ring-inset ring-white/[.07] transition-[box-shadow] duration-300 hover:shadow-(--shadow-float)">
    {% if section.image %}
      <img src="{{ section.image.url }}" alt="{{ section.title }}" loading="lazy" class="aspect-[4/3] w-full object-cover transition-transform duration-700 ease-[cubic-bezier(.16,1,.3,1)] group-hover:scale-[1.03] sm:aspect-[21/9] lg:aspect-[32/9]">
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent sm:bg-gradient-to-r sm:from-black/75 sm:via-black/35"></div>
    {% else %}
      <div class="poster-fallback aspect-[4/3] w-full sm:aspect-[21/9] lg:aspect-[32/9]"></div>
    {% endif %}
    <div class="absolute inset-0 flex flex-col justify-end p-6 sm:justify-center sm:p-12">
      {% if section.title %}<h2 class="max-w-lg text-2xl font-bold tracking-tight text-white sm:text-4xl">{{ section.title }}</h2>{% endif %}
      {% if section.subtitle %}<p class="mt-2 line-clamp-3 max-w-md text-white/80">{{ section.subtitle }}</p>{% endif %}
      {% if section.cta_label %}<span class="btn-light mt-5 w-fit">{{ section.cta_label }}{% icon "arrow-right" "w-4 h-4" %}</span>{% endif %}
    </div>
  </a>
</section>
